plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets {
    // Game tests and their structure templates: loaded only by runGameTestServer, never packaged into the mod jar.
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // SSC Forge and other deps ship SRG refmaps; remap them for the dev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }

        // Loads data packs headlessly (no EULA prompt), runs the game tests in src/gametest, then exits.
        gameTestServer {
            mods {
                "${project.mod_id}" {
                    source sourceSets.gametest
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    // Unreleased SSC Forge builds (publishToMavenLocal in the SSC Forge repo) take precedence.
    mavenLocal { content { includeGroup 'net.onixary' } }
    // Shape Shifter Curse Forge (published reobf jar).
    maven {
        name = 'SSC Forge'
        url = 'https://raw.githubusercontent.com/gengyoubo/shape-shifter-curse-forge/master/maven-repo'
        content { includeGroup 'net.onixary' }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
            includeGroup 'com.eliotlash.mclib'
        }
    }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // Required
    implementation fg.deobf("net.onixary:shape_shifter_curse:${project.ssc_version}")
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${project.minecraft_version}:${project.geckolib_version}")

    // Optional: accessories are equipped through Curios when it is installed (same version SSC Forge builds against).
    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.9.1+1.20.1:api")

    // MixinExtras (@WrapOperation / @WrapMethod / @Local used by the addon mixins)
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}")) {
        jarJar.ranged(it, "[${project.mixinextras_version},)")
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Optional recipe viewer / tooltip integrations (compile only; loaded only when installed at runtime)
    implementation fg.deobf('curse.maven:jei-238222:9205046')
    implementation fg.deobf('curse.maven:jade-324717:8479276')
}

mixin {
    add sourceSets.main, "${project.mod_id}.refmap.json"
    config "${project.mod_id}.mixins.json"
}

processResources {
    def props = [
            version          : project.version,
            mod_id           : project.mod_id,
            mod_name         : project.mod_name,
            minecraft_version: project.minecraft_version,
            forge_version    : project.forge_version,
            ssc_version      : project.ssc_version,
            geckolib_version : project.geckolib_version,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// The original model suite is a standalone Java program, not a JUnit test.
tasks.register('neoModelTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.sscfa.neomagic.NeoModelTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
check.dependsOn neoModelTest

tasks.register('energyNetworkTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.sscfa.energy.EnergyNetworkTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
check.dependsOn energyNetworkTest

jarJar.enable()

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    manifest {
        attributes([
                'Specification-Title'     : project.mod_id,
                'Specification-Vendor'    : 'MangZai-120',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'MangZai-120',
                'MixinConfigs'            : "${project.mod_id}.mixins.json",
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('balanceTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'github.com.gengyoubo.sscfa.balance.BalanceTests'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
check.dependsOn balanceTest
